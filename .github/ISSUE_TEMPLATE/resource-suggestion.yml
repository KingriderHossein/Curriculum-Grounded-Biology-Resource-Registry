name: Resource suggestion
description: Propose a theory-only scientific resource for a subject roadmap.
title: "[Resource] "
labels: []
body:
  - type: input
    id: subject
    attributes:
      label: Subject ID
      placeholder: CELL-BIOLOGY
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Resource title
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Learning stage
      options:
        - Foundation
        - Core
        - Intermediate
        - Advanced
        - Specialized
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Resource type
      options:
        - Foundation textbook
        - Core textbook
        - Reference textbook
        - Advanced textbook
        - Review article
        - Authoritative reference
        - Open academic resource
    validations:
      required: true

  - type: input
    id: identifier
    attributes:
      label: ISBN / DOI / PMID
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Authoritative source URL
      placeholder: https://...
    validations:
      required: true

  - type: textarea
    id: coverage
    attributes:
      label: Concept IDs / specialized branch
      placeholder: CB04 / organelle-biology
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: Why does this source belong at this stage?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This is theory-only and is not a protocol, laboratory manual, SOP, or hands-on training guide.
          required: true
