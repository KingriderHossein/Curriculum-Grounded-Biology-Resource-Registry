name: پیشنهاد منبع
description: پیشنهاد یک منبع نظری جدید یا یک جایگاه جدید برای منبع موجود.
title: "[Resource] "
labels: []
body:
  - type: input
    id: identifier
    attributes:
      label: ISBN / DOI / PMID
      description: ابتدا بررسی کنید این شناسه از قبل در data/resources.json وجود دارد یا نه.
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: عنوان منبع
    validations:
      required: true

  - type: dropdown
    id: identity_status
    attributes:
      label: وضعیت منبع در رجیستری
      options:
        - این منبع جدید است و باید یک Resource identity ساخته شود
        - این منبع از قبل وجود دارد و فقط Placement جدید می‌خواهم
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: لینک رسمی ناشر یا ژورنال
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: subject
    attributes:
      label: Subject ID
      placeholder: BIOCHEMISTRY
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: جایگاه در مسیر یادگیری
      options:
        - Foundation
        - Core
        - Intermediate
        - Advanced
        - Specialized
    validations:
      required: true

  - type: textarea
    id: coverage
    attributes:
      label: Concept IDها / شاخه تخصصی
      placeholder: BC03 / enzymology-kinetics
    validations:
      required: true

  - type: textarea
    id: rationale
    attributes:
      label: چرا این منبع دقیقاً در این جایگاه قرار می‌گیرد؟
    validations:
      required: true

  - type: textarea
    id: student_guidance
    attributes:
      label: راهنمای فارسی دانشجو
      description: چهار سؤال زیر را پاسخ دهید.
      placeholder: |
        مناسب برای:
        چرا این منبع:
        چگونه استفاده شود:
        قدم بعدی:
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: کنترل دامنه
      options:
        - label: این منبع نظری است و پروتکل، راهنمای آزمایشگاهی، SOP یا آموزش عملی نیست.
          required: true
