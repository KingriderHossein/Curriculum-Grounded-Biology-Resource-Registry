name: Apply reviewed feature-branch content update

on:
  push:
    branches: [feat/microbiology-roadmap]
    paths: ['.github/workflows/apply-reviewed-cover-update.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'KingriderHossein/Curriculum-Grounded-Biology-Resource-Registry' && github.ref == 'refs/heads/feat/microbiology-roadmap' && github.actor == 'KingriderHossein'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic reviewed migration
        run: |
          python scripts/migrations/finish_microbiology_v1.py
          python scripts/validate_registry.py
      - name: Commit only scoped content changes without forcing
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/microbiology-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git diff --exit-code -- .github scripts
          git add data/resources.json data/placements.json data/subjects.json README.md subjects/*/README.md docs/project-map.md
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: apply visually reviewed cover replacements and Microbiology corrections'
            git push origin HEAD:refs/heads/feat/microbiology-roadmap
          fi
      - name: Export resulting source for local review
        run: |
          mkdir -p verified-source
          git archive HEAD > verified-source/source.tar
          git rev-parse HEAD > verified-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-content-source
          path: verified-source/
          retention-days: 7
