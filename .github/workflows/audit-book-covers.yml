name: Audit book covers

on:
  push:
    branches: [feat/microbiology-roadmap]
    paths: ['.github/workflows/audit-book-covers.yml']
  pull_request:
    paths: ['scripts/audit_book_covers.py', 'data/resources.json', 'subjects/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cover-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoders
        run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2'
      - name: Export exact public source snapshot
        run: |
          mkdir -p cover-audit
          git archive HEAD > cover-audit/source.tar
      - name: Collect remaining images without approving them
        run: python scripts/inspect_remaining_covers.py
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-cover-audit-${{ github.run_id }}
          path: cover-audit/
          retention-days: 7
          if-no-files-found: error
