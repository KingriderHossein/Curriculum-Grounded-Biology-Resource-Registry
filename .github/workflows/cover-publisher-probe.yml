name: Inspect three publisher cover alternatives
on:
  push:
    branches: [feat/microbiology-roadmap]
    paths: ['.github/workflows/cover-publisher-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2'
      - name: Decode fixed public publisher candidates
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from audit_book_covers import fetch_image,decode
          urls = {
            'signaling-publisher':'https://images.routledge.com/common/jackets/crclarge/978036727/9780367279370.jpg',
            'genetic-theory-publisher':'https://media.wiley.com/product_data/coverImage300/29/11180869/1118086929.jpg',
            'molecular-publisher':'https://ars.els-cdn.com/content/image/3-s2.0-C20150062293-cov200h.gif',
            'molecular-publisher150':'https://ars.els-cdn.com/content/image/3-s2.0-C20150062293-cov150h.gif',
            'signaling-booksense':'https://images.booksense.com/images/370/279/9780367279370.jpg',
            'genetic-theory-booksense':'https://images.booksense.com/images/926/086/9781118086926.jpg',
            'molecular-booksense':'https://images.booksense.com/images/883/132/9780128132883.jpg'
          }
          out=Path('publisher-probe');out.mkdir(exist_ok=True);rows=[]
          for label,url in urls.items():
            row={'label':label,'url':url}
            try:
              data,ct,final_url=fetch_image(url);im=decode(data,ct)
              row.update(status='decoded',sha256=hashlib.sha256(data).hexdigest(),dimensions=list(im.size),content_type=ct,final_url=final_url)
              im.thumbnail((400,600));im.save(out/(label+'.png'))
            except Exception as exc:
              row.update(status='failed',error=str(exc))
            rows.append(row);print(json.dumps(row),flush=True)
          (out/'report.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-cover-alternatives
          path: publisher-probe/
          retention-days: 7
